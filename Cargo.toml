[package]
name = "clankr"
version = "0.1.0"
edition = "2024"
description = "A minimal terminal AI client"
authors = ["vladkens"]
license = "MIT"
readme = "readme.md"

[lints.rust]
non_camel_case_types = "allow"
unreachable_code = "allow"
unused_assignments = "allow"
unused_imports = "deny"

[lints.clippy]
needless_range_loop = "allow"
single_match = "allow"

[profile.release]
panic = "abort"
strip = false
lto = false

[dependencies]
arboard = { version = "3.6.1", default-features = false }
crossterm = "0.29.0"
fastrand = "2.5.0"
mdtext = "0.1.2"
osc8 = "0.1.0"
thiserror = "2.0.21"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"
