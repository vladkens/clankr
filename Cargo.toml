[package]
name = "clankr"
version = "0.1.0"
edition = "2024"
description = "A minimal terminal AI client"
authors = ["vladkens"]
license = "MIT"
readme = "readme.md"

[lints.rust]
non_camel_case_types = "allow"
unreachable_code = "allow"
unused_assignments = "allow"
unused_imports = "deny"

[lints.clippy]
needless_range_loop = "allow"
single_match = "allow"

[profile.release]
panic = "abort"
strip = false
lto = false

[dependencies]
arboard = { version = "3.6.1", default-features = false }
crossterm = "0.29.0"
fastrand = "2.5.0"
mdtext = { git = "https://github.com/kirawi/mdtext", rev = "0c023d6bf27453e772422b4a45b60a34acff0311", version = "0.1.2" }
osc8 = "0.1.0"
pulldown-latex = "0.8.0"
thiserror = "2.0.21"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-diff = "0.1.0"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.27.1"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
url = "2.5.8"
